name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * *"   # nightly --bootstrap run, 07:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: NovaLang tests (direct)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/run_tests.py

  bootstrap:
    name: NovaLang tests (--bootstrap, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/run_tests.py --bootstrap
