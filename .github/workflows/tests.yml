name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * *"   # nightly --bootstrap run, 07:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: NovaLang tests (direct)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/run_tests.py
      - name: Host tests (headless bridge + CSV)
        # unittest exits 5 when it finds no tests (Python 3.12+), so an empty
        # or misnamed suite fails here instead of passing silently. Runners
        # are slower and noisier than a workstation, so the 100 ms UI budget
        # assertion gets 3x headroom in CI; locally it is the real 100 ms.
        env:
          OMNICALC_BUDGET_MS: "300"
        run: python3 -m unittest discover -s tests/host -p "*_test.py" -t . -v

  bootstrap:
    name: NovaLang tests (--bootstrap, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/run_tests.py --bootstrap

  performance:
    name: Performance monitor (nightly; not a merge gate)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Time every screen's calculate path (median, p90)
        # Fails only this nightly job, on a >20% median regression against
        # tools/perf_baseline.json (when one is committed).
        run: python3 tools/perf.py --runs 20 --out perf-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results.json
